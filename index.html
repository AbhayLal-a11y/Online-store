async function copyText(text,cb){
  try{await navigator.clipboard.writeText(text);cb();}
  catch{
    const el=document.createElement("textarea");
    el.value=text; document.body.appendChild(el);
    el.select(); document.execCommand("copy");
    document.body.removeChild(el); cb();
  }
}

async function shrinkImg(file){
  return new Promise(res=>{
    const fr=new FileReader();
    fr.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const c=document.createElement("canvas");
        const sc=Math.min(700/img.width,1);
        c.width=img.width*sc; c.height=img.height*sc;
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL("image/jpeg",0.75));
      };
      img.src=e.target.result;
    };
    fr.readAsDataURL(file);
  });
}

  const col=t.type==="ok"?T.acc:t.type==="err"?T.red:T.white;
  const b=t.type==="ok"?"rgba(200,255,0,.25)":t.type==="err"?"rgba(255,60,60,.25)":T.bdr2;

function AuthModal({show,onClose,onAuth}){
  const[mode,setMode]=useState("in");
  const[email,setEmail]=useState("");
  const[name,setName]=useState("");
  const[phone,setPhone]=useState("");
  const[pass,setPass]=useState("");
  const[err,setErr]=useState("");
  const[busy,setBusy]=useState(false);
  useEffect(()=>{if(show){setErr("");setEmail("");setPass("");setName("");setPhone("");setBusy(false);}},[show]);

  async function signIn(){
    setErr(""); setBusy(true);
    if(!email.trim()||!pass.trim()){setErr("Fill all fields.");setBusy(false);return;}
    // Main admin
    if(email.trim().toLowerCase()===ADMIN_EMAIL.toLowerCase()){
      if(pass===ADMIN_PASS){onAuth({id:"main-admin",email:ADMIN_EMAIL,name:"Admin",role:"admin",isMain:true});setBusy(false);return;}
      setErr("Wrong password.");setBusy(false);return;
    }
    // Partner admin
    const partnerAdmin=await DB.getAdminByEmail(email.trim());
    if(partnerAdmin){
      if(partnerAdmin.password!==pw(pass)){setErr("Wrong password.");setBusy(false);return;}
      onAuth({...partnerAdmin,role:"admin",isMain:false});setBusy(false);return;
    }
    // Customer
    const found=await DB.getUserByEmail(email.trim());
    if(!found){setErr("No account found. Sign up first.");setBusy(false);return;}
    if(found.password!==pw(pass)){setErr("Wrong password.");setBusy(false);return;}
    onAuth(found);setBusy(false);
  }

  async function signUp(){
    setErr(""); setBusy(true);
    if(!name.trim()||!email.trim()||!phone.trim()||!pass.trim()){setErr("Fill all fields.");setBusy(false);return;}
    if(email.trim().toLowerCase()===ADMIN_EMAIL.toLowerCase()){setErr("That email is reserved.");setBusy(false);return;}
    const existing=await DB.getUserByEmail(email.trim());
    if(existing){setErr("Account exists. Sign in.");setBusy(false);return;}
    const u={id:uid(),email:email.trim().toLowerCase(),name:name.trim(),phone:phone.trim(),password:pw(pass),role:"customer",created_at:new Date().toISOString()};
    await DB.addUser(u);
    onAuth(u); setBusy(false);
  }

  if(!show)return null;
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(5,5,5,.97)",zIndex:800,display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{background:T.card,border:`1px solid ${T.bdr2}`,padding:"2.8rem",width:"100%",maxWidth:420,position:"relative",animation:"fadeUp .35s ease"}}>
        <button onClick={onClose} style={{position:"absolute",top:"1.2rem",right:"1.2rem",background:"none",border:"none",color:T.mut,fontFamily:"'Space Mono',monospace",fontSize:".6rem",cursor:"pointer",letterSpacing:".12em"}}>✕ CLOSE</button>
        <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"2.2rem",letterSpacing:".1em",marginBottom:".4rem"}}>NOXEZ<span style={{color:T.acc}}>DRIPS</span></div>
        <div style={{fontStyle:"italic",color:T.mid,fontSize:"1rem",marginBottom:"2rem"}}>{mode==="in"?"Welcome back.":"Join the movement."}</div>
        <div style={{display:"flex",borderBottom:`1px solid ${T.bdr}`,marginBottom:"1.8rem"}}>
          {[["in","Sign In"],["up","Sign Up"]].map(([id,label])=>(
            <button key={id} onClick={()=>{setMode(id);setErr("");}} style={{flex:1,fontFamily:"'Space Mono',monospace",fontSize:".62rem",letterSpacing:".18em",textTransform:"uppercase",background:"transparent",border:"none",borderBottom:`2px solid ${mode===id?T.acc:"transparent"}`,color:mode===id?T.acc:T.mid,padding:".8rem",cursor:"pointer",marginBottom:-1,transition:"all .2s"}}>{label}</button>
          ))}
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:"1rem"}}>
          {mode==="up"&&<div style={{display:"flex",flexDirection:"column",gap:".5rem"}}><label style={LBL}>Full Name</label><input style={SI} placeholder="Your full name" value={name} onChange={e=>setName(e.target.value)}/></div>}
          <div style={{display:"flex",flexDirection:"column",gap:".5rem"}}><label style={LBL}>Email</label><input style={SI} type="email" placeholder="you@email.com" value={email} onChange={e=>setEmail(e.target.value)}/></div>
          {mode==="up"&&<div style={{display:"flex",flexDirection:"column",gap:".5rem"}}><label style={LBL}>Phone</label><input style={SI} type="tel" placeholder="+91 00000 00000" value={phone} onChange={e=>setPhone(e.target.value)}/></div>}
          <div style={{display:"flex",flexDirection:"column",gap:".5rem"}}><label style={LBL}>Password</label><input style={SI} type="password" placeholder="••••••••" value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&(mode==="in"?signIn():signUp())}/></div>
          {err&&<div style={{fontFamily:"'Space Mono',monospace",fontSize:".6rem",color:T.red,letterSpacing:".08em"}}>⚠ {err}</div>}
          <button onClick={mode==="in"?signIn:signUp} disabled={busy} style={{background:busy?T.mut:T.acc,color:T.bg,border:"none",padding:"1rem",fontFamily:"'Space Mono',monospace",fontSize:".72rem",letterSpacing:".2em",textTransform:"uppercase",fontWeight:700,cursor:busy?"default":"pointer",marginTop:".5rem"}}>
            {busy?"Please wait...":(mode==="in"?"Sign In →":"Create Account →")}
          </button>
        </div>
      </div>
    </div>
  );
}

function SizeStock({label,data,onChange}){
  const on=data?.on??true;
  const stock=data?.stock??0;
  return(
    <div style={{background:T.bg2,border:`1px solid ${on?T.bdr2:"rgba(255,60,60,.2)"}`,padding:".8rem .5rem",display:"flex",flexDirection:"column",alignItems:"center",gap:".5rem"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",width:"100%"}}>
        <span style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.3rem",letterSpacing:".06em",color:on?T.white:T.mut}}>{label}</span>
        <button title={on?"Disable":"Enable"} onClick={()=>onChange({stock,on:!on})} style={{width:14,height:14,borderRadius:"50%",background:on?T.acc:"rgba(255,60,60,.5)",border:"none",cursor:"pointer",flexShrink:0,transition:"background .2s"}}/>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:".4rem",width:"100%",justifyContent:"center"}}>
        <button onClick={()=>onChange({on,stock:Math.max(0,stock-1)})} style={{width:26,height:26,background:T.bdr2,border:"none",color:T.white,fontSize:"1rem",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>−</button>
        <span style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.5rem",color:!on?T.mut:stock===0?T.red:T.acc,minWidth:24,textAlign:"center"}}>{stock}</span>
        <button onClick={()=>onChange({on,stock:stock+1})} style={{width:26,height:26,background:T.acc,border:"none",color:T.bg,fontSize:"1rem",fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>+</button>
      </div>
      <div style={{fontFamily:"'Space Mono',monospace",fontSize:".48rem",letterSpacing:".1em",textTransform:"uppercase",color:on?T.mid:T.red}}>{on?(stock===0?"out of stock":"active"):"disabled"}</div>
    </div>
  );
}

  const[toast,setToast]=useState(null);
  const[dayMap,setDayMap]=useState({});

  const[lastOid,setLastOid]=useState("");

  const[newAdmin,setNewAdmin]=useState({email:"",name:"",password:""});
  const[adminBusy,setAdminBusy]=useState(false);

  // ── BOOT ──────────────────────────────

  // ── PRODUCT ACTIONS ───────────────────
  async function updateSize(pid,size,data){
    const p=products.find(x=>x.id===pid);
    if(!p)return;

    await DB.deleteProduct(id);
    setProducts(prev=>prev.filter(p=>p.id!==id));
    toast_(`"${name}" deleted`);

  async function acceptOrder(oid_){

    await DB.updateOrder(oid_,{status:"Accepted",delivery_days:d});

  async function setStatus(oid_,status){
    await DB.updateOrder(oid_,{status});
    setOrders(prev=>prev.map(o=>o.order_id===oid_?{...o,status}:o));

    if(existing){toast_("Admin already exists","err");setAdminBusy(false);return;}
    const a={id:uid(),email:newAdmin.email.trim().toLowerCase(),name:newAdmin.name.trim(),password:pw(newAdmin.password),added_by:ADMIN_EMAIL,created_at:new Date().toISOString()};
    const ok=await DB.addAdmin(a);
    if(!ok){toast_("Error adding admin","err");setAdminBusy(false);return;}
    setAdmins(prev=>[a,...prev]);
    setNewAdmin({email:"",name:"",password:""});
    toast_(`${a.name} added as admin ✅`);

            <button onClick={()=>go("home")} style={{fontFamily:"'Space Mono',monospace",fontSize:".68rem",letterSpacing:".2em",textTransform:"uppercase",background:"transparent",color:T.white,border:`1px solid ${T.bdr2}`,padding:".95rem 2.2rem",cursor:"pointer"}}>Continue Shopping</button>

            <div style={{marginTop:"2rem",padding:"3rem",border:`1px solid ${T.bdr}`,textAlign:"center"}}>

            </div>
          ):(
            <>
              <p style={{fontStyle:"italic",color:T.mid,marginTop:".5rem",marginBottom:"2.5rem",fontSize:"1.05rem"}}>Showing orders for {user.name}</p>
              {myOrders.length===0?(
                <div style={{padding:"3rem",textAlign:"center",border:`1px solid ${T.bdr}`,fontFamily:"'Space Mono',monospace",fontSize:".65rem",letterSpacing:".2em",textTransform:"uppercase",color:T.mut}}>No orders yet. Go shop! 🛍</div>
              ):(
                <div style={{display:"flex",flexDirection:"column",gap:"1px"}}>
                  {myOrders.map(o=>{
                    const sc=sCol(o.status,o.cancelled);

                    return(
                      <div key={o.id} style={{background:T.card,border:`1px solid ${T.bdr}`,padding:"1.8rem",opacity:o.cancelled?.5:1}}>

                          <div style={{display:"flex",alignItems:"center",gap:".6rem",flexWrap:"wrap"}}>
                            <CopyBtn orderId={o.order_id} toast_={toast_}/>
                            <span style={{fontFamily:"'Space Mono',monospace",fontSize:".55rem",letterSpacing:".18em",textTransform:"uppercase",background:`${sc}15`,color:sc,border:`1px solid ${sc}30`,padding:".3rem .65rem"}}>{o.cancelled?"Cancelled":o.status}</span>
                          </div>
                        </div>
                        <div style={{display:"grid",gridTemplateColumns:"auto 1fr",gap:"1.2rem",alignItems:"start"}}>
                          {o.product_image?<img src={o.product_image} alt={o.product_name} style={{width:70,height:90,objectFit:"cover"}}/>:<div style={{width:70,height:90,background:"linear-gradient(140deg,#0d0d14,#1a1a2e)",display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.5rem",color:"rgba(200,255,0,.1)"}}>{o.product_name[0]}</span></div>}
                          <div>
                            <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.3rem",letterSpacing:".06em"}}>{o.product_name}</div>
                            <div style={{fontFamily:"'Space Mono',monospace",fontSize:".6rem",letterSpacing:".1em",color:T.mid,marginTop:".4rem",lineHeight:1.9}}>Size: {o.size} · {money(o.price)} · COD<br/>📍 {o.address}<br/>{new Date(o.created_at).toLocaleDateString("en-IN")}</div>
                            {o.delivery_days>0&&!o.cancelled&&<div style={{fontFamily:"'Space Mono',monospace",fontSize:".6rem",letterSpacing:".1em",color:T.acc,marginTop:".5rem"}}>🚚 Est. {o.delivery_days} day{o.delivery_days>1?"s":""} from acceptance</div>}
                          </div>
                        </div>
                        {canCancel&&<button onClick={()=>cancelMyOrder(o.order_id)} style={{marginTop:"1.2rem",fontFamily:"'Space Mono',monospace",fontSize:".6rem",letterSpacing:".18em",textTransform:"uppercase",background:"transparent",border:`1px solid ${T.bdr}`,color:T.mid,padding:".5rem 1rem",cursor:"pointer"}}>Cancel Order</button>}
                      </div>
                    );
                  })}
                </div>
              )}
            </>
          )}
        </div>
      )}

      {/* ════ ADMIN GATE ════ */}
      {page==="admin"&&!user&&(
        <div style={{padding:"8rem 2rem",textAlign:"center",minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
          <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"2rem",letterSpacing:".08em",marginBottom:"1.2rem"}}>Admin Access Required</div>
          <button onClick={()=>setShowAuth(true)} style={{fontFamily:"'Space Mono',monospace",fontSize:".68rem",letterSpacing:".18em",textTransform:"uppercase",background:T.acc,color:T.bg,border:"none",padding:".9rem 2rem",fontWeight:700,cursor:"pointer"}}>Sign In as Admin</button>
        </div>
      )}

      {/* ════ ADMIN PANEL ════ */}
      {page==="admin"&&user?.role==="admin"&&(
        <div style={{padding:"6rem 2rem 5rem",maxWidth:1120,margin:"0 auto"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"2.5rem",borderBottom:`1px solid ${T.bdr}`,paddingBottom:"1.2rem",flexWrap:"wrap",gap:"1rem"}}>
            <div>
              <h2 style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"2.5rem",letterSpacing:".08em"}}>NOXEZ<span style={{color:T.acc}}>DRIPS</span> Admin</h2>
              <div style={{fontFamily:"'Space Mono',monospace",fontSize:".58rem",letterSpacing:".15em",color:T.mut,marginTop:".3rem"}}>{user.email} · {user.isMain?"Main Admin":"Partner Admin"}</div>
            </div>
            <div style={{display:"flex",gap:".8rem"}}>
              <button onClick={()=>go("home")} style={{fontFamily:"'Space Mono',monospace",fontSize:".58rem",letterSpacing:".15em",textTransform:"uppercase",background:"transparent",border:`1px solid ${T.bdr2}`,color:T.mid,padding:".5rem 1rem",cursor:"pointer"}}>← Store</button>
              <button onClick={logout} style={{fontFamily:"'Space Mono',monospace",fontSize:".58rem",letterSpacing:".15em",textTransform:"uppercase",background:"transparent",border:"1px solid rgba(255,60,60,.3)",color:T.red,padding:".5rem 1rem",cursor:"pointer"}}>Logout</button>
            </div>
          </div>

          <div style={{display:"flex",borderBottom:`1px solid ${T.bdr}`,marginBottom:"2rem",flexWrap:"wrap"}}>

              ["orders","📦 Orders"],
              ["products","👕 Products"],
              ...(user.isMain?[["team","👥 Team"]]:[]
            )].map(([id,label])=>(
              <button key={id} onClick={()=>{setAdminTab(id);if(id==="orders")loadAdminOrders();if(id==="team")DB.getAdmins().then(a=>setAdmins(a));}} style={{fontFamily:"'Space Mono',monospace",fontSize:".63rem",letterSpacing:".2em",textTransform:"uppercase",background:"transparent",border:"none",cursor:"pointer",padding:".9rem 1.5rem",marginBottom:-1,borderBottom:`2px solid ${adminTab===id?T.acc:"transparent"}`,color:adminTab===id?T.acc:T.mut,transition:"all .2s"}}>{label}</button>
            ))}
          </div>

          {adminTab==="orders"&&(
            <div>

                <span style={{position:"absolute",left:"1rem",top:"50%",transform:"translateY(-50%)",color:T.mut,fontSize:"1rem"}}>🔍</span>
                {searchQ&&<button onClick={()=>setSearchQ("")} style={{position:"absolute",right:"1rem",top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:T.mut,cursor:"pointer",fontSize:".7rem",fontFamily:"'Space Mono',monospace"}}>✕ Clear</button>}
              </div>
              <div style={{fontFamily:"'Space Mono',monospace",fontSize:".58rem",letterSpacing:".15em",color:T.mut,marginBottom:"1rem"}}>

                {orders.length===0&&<button onClick={loadAdminOrders} style={{marginLeft:"1rem",fontFamily:"'Space Mono',monospace",fontSize:".58rem",letterSpacing:".15em",textTransform:"uppercase",background:T.acc,color:T.bg,border:"none",padding:".3rem .7rem",cursor:"pointer",fontWeight:700}}>Load Orders</button>}
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:"1px"}}>
                {filteredOrders.length===0?(
                  <div style={{padding:"3rem",textAlign:"center",border:`1px solid ${T.bdr}`,fontFamily:"'Space Mono',monospace",fontSize:".65rem",letterSpacing:".2em",textTransform:"uppercase",color:T.mut}}>{searchQ?"No orders match your search.":"No orders yet."}</div>

                  filteredOrders.map(o=>{
                    const sc=sCol(o.status,o.cancelled);

                      <div key={o.id} style={{background:T.card,border:`1px solid ${T.bdr}`,padding:"1.8rem",opacity:o.cancelled?.4:1}}>

                          <div style={{display:"flex",alignItems:"center",gap:".8rem",flexWrap:"wrap"}}>
                            <span style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.4rem",letterSpacing:".1em",color:T.acc}}>#{o.order_id}</span>

                          </div>
                          <span style={{fontFamily:"'Space Mono',monospace",fontSize:".56rem",letterSpacing:".12em",color:T.mut}}>{new Date(o.created_at).toLocaleString("en-IN")}</span>
                        </div>
                        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"1.5rem",marginBottom:"1.5rem"}}>
                          <div><div style={{fontFamily:"'Space Mono',monospace",fontSize:".56rem",letterSpacing:".22em",textTransform:"uppercase",color:T.acc,marginBottom:".7rem"}}>Customer</div><div style={{fontFamily:"'Space Mono',monospace",fontSize:".64rem",letterSpacing:".07em",color:T.mid,lineHeight:2}}><strong style={{color:T.white}}>{o.customer_name}</strong><br/>📱 {o.phone}<br/>📍 {o.address}</div></div>
                          <div><div style={{fontFamily:"'Space Mono',monospace",fontSize:".56rem",letterSpacing:".22em",textTransform:"uppercase",color:T.acc,marginBottom:".7rem"}}>Order</div><div style={{fontFamily:"'Space Mono',monospace",fontSize:".64rem",letterSpacing:".07em",color:T.mid,lineHeight:2}}><strong style={{color:T.white}}>{o.product_name}</strong><br/>Size: {o.size}<br/>{money(o.price)} · COD</div></div>
                        </div>
                        {o.cancelled?(
                          <div style={{fontFamily:"'Space Mono',monospace",fontSize:".56rem",letterSpacing:".15em",textTransform:"uppercase",color:T.red,padding:".35rem .7rem",border:"1px solid rgba(255,60,60,.2)",display:"inline-block"}}>✕ Cancelled by Customer</div>
                        ):(
                          <div style={{display:"flex",gap:".8rem",flexWrap:"wrap",paddingTop:"1.2rem",borderTop:`1px solid ${T.bdr}`,alignItems:"center"}}>

                            <select value={o.status} onChange={e=>setStatus(o.order_id,e.target.value)} style={{background:T.bg2,border:`1px solid ${T.bdr2}`,color:T.white,fontFamily:"'Space Mono',monospace",fontSize:".62rem",letterSpacing:".08em",padding:".55rem .8rem",outline:"none",cursor:"pointer"}}>

                        )}
                      </div>
                    );

                )}
              </div>
            </div>
          )}

          {adminTab==="products"&&(

              <div style={{background:T.card,border:`1px solid ${T.bdr2}`,padding:"2rem",marginBottom:"2rem"}}>
                <div style={{display:"flex",alignItems:"center",gap:".8rem",marginBottom:"1.8rem"}}>
                  <div style={{width:38,height:38,background:T.acc,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.6rem",color:T.bg,fontWeight:700,flexShrink:0}}>+</div>
                  <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.8rem",letterSpacing:".08em"}}>Add New Product</div>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"1rem"}}>
                  <div style={{display:"flex",flexDirection:"column",gap:".5rem"}}><label style={LBL}>Product Name *</label><input style={SI} placeholder="e.g. Void Bomber Jacket" value={newProd.name} onChange={e=>setNewProd({...newProd,name:e.target.value})}/></div>

                  <div style={{display:"flex",flexDirection:"column",gap:".5rem",gridColumn:"1/-1"}}><label style={LBL}>Description</label><input style={SI} placeholder="Short description (optional)" value={newProd.desc} onChange={e=>setNewProd({...newProd,desc:e.target.value})}/></div>
                  <div style={{display:"flex",flexDirection:"column",gap:".5rem",gridColumn:"1/-1"}}>
                    <label style={LBL}>Product Image</label>
                    <div style={{display:"flex",gap:"1rem",alignItems:"center",flexWrap:"wrap"}}>
                      <input ref={fileRef} type="file" accept="image/*" onChange={handleImg} style={{display:"none"}}/>
                      <button onClick={()=>fileRef.current.click()} style={{fontFamily:"'Space Mono',monospace",fontSize:".6rem",letterSpacing:".15em",textTransform:"uppercase",background:T.acc,color:T.bg,border:"none",padding:".7rem 1.3rem",fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>📷 Upload Photo</button>
                      <span style={{fontFamily:"'Space Mono',monospace",fontSize:".56rem",color:T.mut}}>or paste URL:</span>
                      <input style={{...SI,flex:1}} placeholder="https://..." value={newProd.image.startsWith?.("http")?newProd.image:""} onChange={e=>setNewProd({...newProd,image:e.target.value})}/>
                    </div>
                    {newProd.image&&(<div style={{display:"flex",gap:"1rem",alignItems:"center",marginTop:".8rem"}}><img src={newProd.image} alt="preview" style={{width:70,height:90,objectFit:"cover",border:`1px solid ${T.bdr2}`}}/><div><div style={{fontFamily:"'Space Mono',monospace",fontSize:".56rem",color:T.acc,marginBottom:".5rem"}}>✓ Image ready</div><button onClick={()=>setNewProd({...newProd,image:""})} style={{fontFamily:"'Space Mono',monospace",fontSize:".55rem",letterSpacing:".12em",textTransform:"uppercase",background:"transparent",border:`1px solid ${T.bdr}`,color:T.mut,padding:".3rem .6rem",cursor:"pointer"}}>Remove</button></div></div>)}
                  </div>
                  <div style={{gridColumn:"1/-1"}}>
                    <label style={{...LBL,display:"block",marginBottom:".8rem"}}>Sizes & Stock — + / − to set · dot to enable/disable</label>
                    <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:".5px"}}>
                      {["S","M","L","XL"].map(s=><SizeStock key={s} label={s} data={newProd.sizes[s]} onChange={d=>setNewProd({...newProd,sizes:{...newProd.sizes,[s]:d}})}/>)}
                    </div>
                  </div>
                </div>
                <button onClick={addProduct} style={{fontFamily:"'Space Mono',monospace",fontSize:".68rem",letterSpacing:".2em",textTransform:"uppercase",background:T.acc,color:T.bg,border:"none",padding:".9rem 2rem",fontWeight:700,cursor:"pointer",marginTop:"1.5rem",display:"flex",alignItems:"center",gap:".6rem"}}><span style={{fontSize:"1.1rem"}}>+</span> Add Product to Store</button>
              </div>
              {products.length===0?(
                <div style={{padding:"3rem",textAlign:"center",border:`1px solid ${T.bdr}`,fontFamily:"'Space Mono',monospace",fontSize:".65rem",letterSpacing:".2em",textTransform:"uppercase",color:T.mut}}>No products yet.</div>

                <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:"1.5px"}}>

                        {p.image?<img src={p.image} alt={p.name} style={{width:"100%",aspectRatio:"3/4",objectFit:"cover",display:"block"}}/>:<div style={{width:"100%",aspectRatio:"3/4",background:"linear-gradient(140deg,#0d0d14,#1a1a2e)",display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"4rem",color:"rgba(200,255,0,.05)"}}>{p.name[0]}</span></div>}

                      </div>
                      <div style={{padding:"1.2rem"}}>
                        <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.4rem",letterSpacing:".06em"}}>{p.name}</div>
                        <div style={{fontFamily:"'Space Mono',monospace",fontSize:".65rem",color:T.mid,marginTop:".3rem",marginBottom:"1rem"}}>{money(p.price)}</div>
                        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:".5px",marginBottom:"1rem"}}>

                        <div style={{fontFamily:"'Space Mono',monospace",fontSize:".5rem",letterSpacing:".1em",color:T.mut,marginBottom:"1rem"}}>Changes save instantly to all devices</div>
                        <button onClick={()=>deleteProduct(p.id,p.name)} style={{width:"100%",fontFamily:"'Space Mono',monospace",fontSize:".58rem",letterSpacing:".15em",textTransform:"uppercase",background:"transparent",border:"1px solid rgba(255,60,60,.2)",color:T.red,padding:".6rem",cursor:"pointer"}}>Delete Product</button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* ── TEAM (main admin only) ── */}
          {adminTab==="team"&&user.isMain&&(
            <div>
              {/* Add partner admin */}
              <div style={{background:T.card,border:`1px solid ${T.bdr2}`,padding:"2rem",marginBottom:"2rem"}}>
                <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.8rem",letterSpacing:".08em",marginBottom:"1.5rem"}}>Add Partner Admin</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"1rem",marginBottom:"1rem"}}>
                  <div style={{display:"flex",flexDirection:"column",gap:".5rem"}}><label style={LBL}>Partner Name *</label><input style={SI} placeholder="e.g. Rahul" value={newAdmin.name} onChange={e=>setNewAdmin({...newAdmin,name:e.target.value})}/></div>
                  <div style={{display:"flex",flexDirection:"column",gap:".5rem"}}><label style={LBL}>Partner Email *</label><input style={SI} type="email" placeholder="partner@email.com" value={newAdmin.email} onChange={e=>setNewAdmin({...newAdmin,email:e.target.value})}/></div>
                  <div style={{display:"flex",flexDirection:"column",gap:".5rem",gridColumn:"1/-1"}}><label style={LBL}>Password for them *</label><input style={SI} type="password" placeholder="Create a password for this admin" value={newAdmin.password} onChange={e=>setNewAdmin({...newAdmin,password:e.target.value})}/></div>
                </div>
                <div style={{fontFamily:"'Space Mono',monospace",fontSize:".58rem",letterSpacing:".1em",color:T.mut,marginBottom:"1rem",lineHeight:1.8}}>
                  ℹ️ Share their email + password with your partner.<br/>They sign in the same way you do and get full admin access.
                </div>
                <button onClick={addPartnerAdmin} disabled={adminBusy} style={{fontFamily:"'Space Mono',monospace",fontSize:".68rem",letterSpacing:".2em",textTransform:"uppercase",background:adminBusy?T.mut:T.acc,color:T.bg,border:"none",padding:".9rem 2rem",fontWeight:700,cursor:adminBusy?"default":"pointer",display:"flex",alignItems:"center",gap:".6rem"}}><span>+</span>{adminBusy?"Adding...":"Add Partner Admin"}</button>
              </div>

              {/* Partner admins list */}
              <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.5rem",letterSpacing:".08em",marginBottom:"1rem"}}>Current Partners</div>
              {admins.length===0?(
                <div style={{padding:"2rem",textAlign:"center",border:`1px solid ${T.bdr}`,fontFamily:"'Space Mono',monospace",fontSize:".65rem",letterSpacing:".2em",textTransform:"uppercase",color:T.mut}}>No partner admins yet.</div>
              ):(
                <div style={{display:"flex",flexDirection:"column",gap:"1px"}}>
                  {admins.map(a=>(
                    <div key={a.id} style={{background:T.card,border:`1px solid ${T.bdr}`,padding:"1.5rem",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:"1rem"}}>
                      <div>
                        <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:"1.3rem",letterSpacing:".06em"}}>{a.name}</div>
                        <div style={{fontFamily:"'Space Mono',monospace",fontSize:".6rem",letterSpacing:".1em",color:T.mid,marginTop:".3rem"}}>{a.email}<br/>Added {new Date(a.created_at).toLocaleDateString("en-IN")}</div>
                      </div>
                      <button onClick={()=>removePartnerAdmin(a.id,a.name)} style={{fontFamily:"'Space Mono',monospace",fontSize:".6rem",letterSpacing:".15em",textTransform:"uppercase",background:"transparent",border:"1px solid rgba(255,60,60,.3)",color:T.red,padding:".5rem 1rem",cursor:"pointer"}}>Remove</button>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<NoxezdripsApp/>);
</script>
</body>
</html>
